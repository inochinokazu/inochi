<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いのちの数 診断｜数秘術</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0F8; --surface:#FFFFFF; --ink:#25264A; --muted:#5F6086; --line:#D9D6E8;
  --gold:#B07C14; --teal:#2B7A74; --btn:#25264A; --btn-ink:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161733; --surface:#202250; --ink:#ECEBFA; --muted:#A9AAD0; --line:#383A74;
    --gold:#E3B650; --teal:#6CC5BC; --btn:#E3B650; --btn-ink:#161733;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161733; --surface:#202250; --ink:#ECEBFA; --muted:#A9AAD0; --line:#383A74;
  --gold:#E3B650; --teal:#6CC5BC; --btn:#E3B650; --btn-ink:#161733;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.85;font-size:16px}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
h1,h2,.num{font-family:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:700}
h1{font-size:1.55rem;line-height:1.5;margin:8px 0 6px;text-align:center}
.lead{text-align:center;color:var(--muted);margin:0 0 20px;font-size:.95rem}
.ring{width:210px;height:210px;margin:0 auto 18px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .arc{stroke:var(--gold);stroke-dasharray:565;stroke-dashoffset:565;transition:stroke-dashoffset 1.2s ease}
.ring.on .arc{stroke-dashoffset:0}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5.6rem;color:var(--ink)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:500;margin-bottom:8px}
input[type=date]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button,.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);
  font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
button:focus-visible,.btn:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn[aria-disabled=true]{opacity:.55;pointer-events:none}
.err{color:#B3261E;margin:10px 0 0;min-height:1.4em;font-size:.9rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FF9C94}}
#result{display:none;margin-top:26px}
#result.show{display:block}
h2{font-size:1.25rem;margin:0 0 4px}
.kw{color:var(--gold);font-weight:700;margin:0 0 10px}
.block{padding:18px 0;border-top:1px solid var(--line)}
.block p{margin:0 0 8px}
.tip{border-left:3px solid var(--teal);padding-left:12px;color:var(--muted)}
.cta{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:20px;margin-top:8px}
.cta h2{margin-bottom:10px}
.cta ul{margin:0 0 4px;padding-left:1.2em}
.cta .hint{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.share{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:.8rem;color:var(--muted);margin-top:28px}
@media (prefers-reduced-motion:reduce){.ring .arc{transition:none}}
</style>
</head>
<body>
<main>
  <h1>生年月日から読む、<br>あなたの「いのちの数」</h1>
  <p class="lead">数秘術で、生まれ持った性質と今年の流れを無料で診断します。</p>

  <div class="ring" id="ring" aria-hidden="true">
    <svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="90" fill="none" stroke-width="3"/><circle class="arc" cx="100" cy="100" r="90" fill="none" stroke-width="5" stroke-linecap="round"/></svg>
    <div class="num" id="bignum">?</div>
  </div>

  <div class="form">
    <label for="dob">生年月日</label>
    <input type="date" id="dob" min="1900-01-01">
    <p class="err" id="err" role="alert"></p>
    <button id="go" type="button">無料で診断する</button>
  </div>

  <section id="result" aria-live="polite">
    <div class="block" style="border-top:0">
      <h2 id="r-title"></h2>
      <p class="kw" id="r-kw"></p>
      <p id="r-body"></p>
      <p class="tip" id="r-tip"></p>
    </div>
    <div class="block">
      <h2 id="y-title"></h2>
      <p id="y-body"></p>
    </div>
    <div class="cta">
      <h2>あなただけの詳細鑑定書（PDF）</h2>
      <ul>
        <li>性格の長所と、つまずきやすい点</li>
        <li>恋愛・仕事・お金それぞれの傾向</li>
        <li>今年と来月の過ごし方</li>
      </ul>
      <a class="btn" id="paid" href="#" target="_blank" rel="noopener">詳細鑑定書を依頼する</a>
      <p class="hint" id="paid-hint"></p>
    </div>
    <a class="btn share" id="share" href="#" target="_blank" rel="noopener">結果をXでシェアする</a>
  </section>

  <p class="note">この診断は娯楽・自己理解の参考として提供しています。医療、法律、お金などの判断は、専門家にご相談ください。</p>
</main>

<script>
// ▼ ココナラ等の出品ページURLをここに入れると、依頼ボタンが有効になります
var PAID_URL = "";
// ▼ 公開後のこのページのURL（シェア文に入ります）。空でも動きます
var PAGE_URL = "";

var LP = {
  1:["開拓者","自分の道を自分で切り開く人です。決断が早く、先頭に立つと力を発揮します。","迷ったら小さく一歩目を踏み出すと、流れが動きます。"],
  2:["調和の人","人の気持ちを読み、間をつなぐ人です。聞き役として深く信頼されます。","自分の本音も同じ重さで扱うと、さらに安定します。"],
  3:["表現の人","言葉や創作で、まわりを明るくする人です。楽しさが原動力になります。","思いつきを形に残す習慣が、大きな武器になります。"],
  4:["土台を築く人","地道に積み上げ、信頼を重ねる人です。約束を守る姿勢が評価されます。","ときどき休むことも、積み上げの一部です。"],
  5:["自由な冒険者","変化と体験を栄養にする人です。好奇心の広さが魅力です。","一つ決めて続けると、経験が実を結びます。"],
  6:["愛情の人","世話好きで、守るものがあると強くなる人です。家庭や仲間を大切にします。","頼まれる前に、自分を満たす時間をつくりましょう。"],
  7:["探究者","一人で深く考え、本質を見抜く人です。専門性を磨くほど輝きます。","考えを言葉にして伝えると、理解者が増えます。"],
  8:["実現の人","目標を形にし、豊かさを引き寄せる人です。責任ある立場で力を発揮します。","成果だけでなく、過程にも目を向けると長続きします。"],
  9:["完成の人","広い視野で人を癒し、手放しながら進む人です。共感力が高く、慕われます。","終わらせることが、次の始まりを連れてきます。"],
  11:["直感の人（マスターナンバー）","繊細な感受性で、人に気づきを届ける人です。インスピレーションが鋭い人です。","心が疲れたら、静かな時間で整えましょう。"],
  22:["大きな建設者（マスターナンバー）","大きな理想を現実の形にする人です。人を巻き込み、仕組みをつくる力があります。","理想を小さな段階に分けると、確実に進みます。"],
  33:["慈愛の人（マスターナンバー）","与えることで、まわりを照らす人です。教え、支える役割が向いています。","背負いすぎず、頼ることも覚えましょう。"]
};
var PY = {
  1:["始まりの年","新しいことを始めるのに向いた年です。種をまく意識で動きましょう。"],
  2:["育てる年","焦らず関係や計画を育てる年です。協力が成果につながります。"],
  3:["広げる年","発信や交流が広がる年です。楽しさを基準に選ぶと流れに乗れます。"],
  4:["整える年","土台を固める年です。仕組みや習慣を整えると、先で楽になります。"],
  5:["変化の年","環境や考え方が動く年です。新しい体験に飛び込むと道が開けます。"],
  6:["つながりの年","人間関係や家庭が主役の年です。大切な人との時間が力になります。"],
  7:["内省の年","立ち止まり、学び、見つめ直す年です。休むことも前進です。"],
  8:["収穫の年","これまでの努力が形になりやすい年です。お金や責任の扱いが鍵です。"],
  9:["手放しの年","区切りをつける年です。不要なものを手放すと、次の扉が見えてきます。"]
};

function red(n,keepMaster){
  while(n>9 && !(keepMaster && (n===11||n===22||n===33))){
    var s=0; String(n).split("").forEach(function(d){s+=+d}); n=s;
  }
  return n;
}
function $(id){return document.getElementById(id)}

$("go").addEventListener("click",function(){
  var v=$("dob").value, err=$("err");
  err.textContent="";
  if(!v){err.textContent="生年月日を入力してください。";return;}
  var p=v.split("-"), y=+p[0], m=+p[1], d=+p[2];
  if(!y||!m||!d||y<1900){err.textContent="正しい生年月日を入力してください。";return;}
  var lp=red(y+m+d+0,true);
  // 各桁を合計する
  var all=(""+y+m+d).split("").reduce(function(a,c){return a+ +c},0);
  lp=red(all,true);
  var thisYear=new Date().getFullYear();
  var py=red(m+d+(""+thisYear).split("").reduce(function(a,c){return a+ +c},0),false);

  var t=LP[lp];
  $("bignum").textContent=lp;
  $("ring").classList.remove("on"); void $("ring").offsetWidth; $("ring").classList.add("on");
  $("r-title").textContent="ライフパスナンバー "+lp+"｜"+t[0];
  $("r-kw").textContent="生まれ持った性質";
  $("r-body").textContent=t[1];
  $("r-tip").textContent=t[2];
  $("y-title").textContent=thisYear+"年のパーソナルイヤー "+py+"｜"+PY[py][0];
  $("y-body").textContent=PY[py][1];

  var a=$("paid"), h=$("paid-hint");
  if(PAID_URL){a.href=PAID_URL;a.removeAttribute("aria-disabled");h.textContent="";}
  else{a.href="#";a.setAttribute("aria-disabled","true");h.textContent="受付の準備中です。もうしばらくお待ちください。";}

  var txt="私のライフパスナンバーは"+lp+"（"+t[0]+"）でした。今年は「"+PY[py][0]+"」。"+(PAGE_URL?"":"")+"\n#数秘術 #ライフパスナンバー";
  $("share").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(txt)+(PAGE_URL?"&url="+encodeURIComponent(PAGE_URL):"");

  $("result").classList.add("show");
  $("result").scrollIntoView({behavior:"smooth",block:"start"});
});
</script>
</body>
</html>
